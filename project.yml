name: HomeLedger
options:
  bundleIdPrefix: com.surproductions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  HomeLedger:
    type: application
    platform: iOS
    sources:
      - path: HomeLedger
    info:
      path: HomeLedger/Info.plist
      properties:
        CFBundleDisplayName: HomeLedger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: HomeLedger uses the camera to photograph your belongings, scan documents and read barcodes. Photos stay on this iPhone.
        NSPhotoLibraryAddUsageDescription: HomeLedger can save exported reports to your photo library only when you choose to.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.homeledger
        PRODUCT_NAME: HomeLedger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  HomeLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HomeLedgerTests
      - path: Config/HomeLedger.storekit
        buildPhase: resources
    dependencies:
      - target: HomeLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.homeledger.tests
  HomeLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HomeLedgerUITests
    dependencies:
      - target: HomeLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.surproductions.homeledger.uitests
        TEST_TARGET_NAME: HomeLedger
schemes:
  HomeLedger:
    build:
      targets:
        HomeLedger: all
        HomeLedgerTests: [test]
        HomeLedgerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/HomeLedger.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - HomeLedger
      targets:
        - name: HomeLedgerTests
          parallelizable: false
        - name: HomeLedgerUITests
          parallelizable: false
    archive:
      config: Release
